# Pinned sources built by install.sh. Change a REF here to move every new Pi
# (and `sudo tfpi-update` on existing ones) to that commit.

FOMU_FLASH_REPO=https://github.com/terriblefire/fomu-flash
FOMU_FLASH_REF=af3a6ddadfabd2da62542ccd441a9f3bfe28ae73   # "fix for the tf4060"

# matrix-io fork with the gpiod_creator cable. The libgpiod version decides the
# commit: 2.x (Trixie) needs the 2.x port, 1.x (Bookworm) the commit before it.
XC3SPROG_REPO=https://github.com/arkadiuszmakarenko/xc3sprog
XC3SPROG_REF=e378481d471932968a289a574b72f3d5e5f7196d          # libgpiod 2.x
XC3SPROG_REF_GPIOD1=927e0bb50e568c11341ad3379da572480ba38183    # libgpiod 1.x

# a314 branch tf4060 (main has no `install-pi.sh tf`)
A314_REPO=https://github.com/erique/a314
A314_REF=34d8f72d4346becdd74f4b8606c9a002e77a7728

# Board this Pi drives; firmware zips for other boards are refused.
BOARD=tf4060r5

# Amiga assembler/linker for relinking the SSBL TOC (same versions as the
# terriblefire78/ice40_cube build image, so the SSBL comes out byte for byte).
VASM_URL=http://phoenix.owl.de/tags/vasm2_0d.tar.gz
VASM_SHA256=a818b0cef018c3b88be998de2c15ece83303cbe4a15f0b391c0203710b262f2e
VLINK_URL=http://phoenix.owl.de/tags/vlink0_18a.tar.gz
VLINK_SHA256=8d151cdd30a4feb575a364e68810c2bc300fe1a7c074dbbee6fd1175a6c5bfae
# Our copies of the same files (checked against the SHA256s above), used when
# the upstream site is down or has moved them.
DEPS_MIRROR=https://github.com/terriblefire/tfpi/releases/download/deps-1
