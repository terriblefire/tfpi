# Installed by tfpi (Gitea #59). a314d must not stay down after it exits:
# the Amiga's PI0: and the other a314 services wait on it. "always" also
# catches exits with status 0. `systemctl stop a314d` (flash, diagnostics,
# update) is never restarted by systemd, so those keep it stopped.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
