{% extends "base.html" %}{% block body %}
<div class="card"><h1>Set a password</h1>
<p class="muted">First visit: choose the password that protects firmware flashing on this Pi.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">
<p><input type="password" name="password" placeholder="Password" required autofocus></p>
<p><input type="password" name="confirm" placeholder="Repeat password" required></p>
<button>Save</button></form></div>
{% endblock %}
